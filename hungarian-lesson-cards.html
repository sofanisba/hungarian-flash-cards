.front{background:var(--card);border:1.5px solid var(--line)}

.row{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 16px inherit}
.btn.go{background:var(--deep);border-color:var(--deep);color:var(--on)}
.btn.no{border-color:var(--red);color:var(--red)}
.qs{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:28px 16px;text-align:center;margin:12px 0}
.o2{display:grid;gap:8px;margin-bottom:12px}
.opt{padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left}
.opt.ok{background:var(--ok);border-color:var(--deep)}
.opt.bad{background:var(--bad);border-color:var(--red)}
.done{text-align:center;padding:32px 0}
.empty{color:var(--mut);padding:24px 0}
button:focus-visible,.card:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

g1|Vowel harmony: how do I pick the vowel in an ending?|Back vowels (a á o ó u ú) take back endings; front vowels (e é i í ö ő ü ű) take front endings. Mixed words usually take back endings. Memory trick: AUTÓ = back, TENISZÜTŐ = front.|ház → házban; kert → kertben; iskola → iskolában
g1|Which endings have three forms?|Many endings have a back/front pair. A few have a third form for words whose last vowel is ö ő ü ű (e.g. possessives, plural, object).|-ban/-ben; -ra/-re; -nak/-nek; -ok/-ek/-ök (plural); -ot/-et/-öt (object)
g1|Long vowels and digraphs|Accents mark long vowels (á é í ó ő ú ű). cs, gy, ly, ny, sz, ty, zs are single letters. A doubled digraph is written with the first letter doubled.|sz + sz = ssz; gy + gy = ggy; zs + zs = zzs; húsz + szor = hússzor
g2|Present tense: one form for now and the future|Hungarian has no continuous tense. The present covers “I do” and “I am doing”, and with a time word it also covers the future.|Éppen dolgozom. / Holnap telefonálok. (I'll call tomorrow.)
g2|Indefinite vs definite conjugation|Use indefinite endings with no object or an indefinite one (egy, no article, a number, sok, hány). Use definite endings when the object is definite (a/az, my, a name, ezt/azt, kit).|Látok egy kutyát. / Látom a kutyát. / Szeretem Budapestet.
g2|Indefinite endings (tanul)|Back verbs: -ok, -sz, (nothing), -unk, -tok, -nak. Front verbs use -ek, -sz, (nothing), -ünk, -tek, -nek.|tanulok, tanulsz, tanul, tanulunk, tanultok, tanulnak; szeretek, szeretsz, szeret
g2|Definite endings (tanul)|Used with a definite object: -om, -od, -ja, -juk, -játok, -ják (back verbs). Verbs in -s, -sz, -z double the consonant in some forms.|tanulom, tanulod, tanulja, tanuljuk, tanuljátok, tanulják
g2|The verb “to be” in the present|vagyok, vagy, van, vagyunk, vagytok, vannak. In the 3rd person it is dropped when you say who or what someone is or what they are like; it stays for location and existence.|Kati tanár. / Kati itthon van. / Ő szép. / Hol van?
g2|“To be” in the past and future|Past: voltam, voltál, volt, voltunk, voltatok, voltak. Future: leszek, leszel, lesz, leszünk, lesztek, lesznek. Negate with nem.|Tegnap otthon voltam. / De lesz magyar állampolgárságom.
g2|Negation: nem and nincs|Put nem directly before the verb (or the word you negate). “There is/I have no…” is nincs (nem + van), with the possessed noun.|Nem vagyok házas. / Nincs gyerekem. / Nincs takarítónőm.
g2|Past tense (first person)|Take the infinitive, replace -ni with -t, add the ending: -tam/-tem (I), -tál/-tél (you), -t (he/she). Verbs with a linking vowel use -ott/-ett/-ött.|dolgozni → dolgoztam; menni → mentem; festeni → festettem; venni → vettem; enni → ettem; inni → ittam; születtem
g2|The infinitive (-ni)|Add -ni to the 3rd person stem (-ik drops). Verbs ending in -t after a consonant or in -ít need a linking vowel. Irregular: van → lenni, megy → menni, eszik → enni, iszik → inni, alszik → aludni.|beszél → beszélni; úszik → úszni; mond → mondani; segít → segíteni
g2|Modal verbs: tud, akar, szeret, szeretne|These take an infinitive. tud = can/know how to, akar = want, szeret = like, szeretne = would like. Kell (must) and lehet (may) do not conjugate.|Tudok gitározni. / Szeretnék orvos lenni. / Itt nem lehet bemenni.
g2|Using ‘vagyok’ with jobs and origin|Say the job with no article. To say you work as something use -ként; to say a language, use -ul/-ül.|Tanár vagyok. / Tanárként dolgozom. / Beszélek magyarul.
g3|Articles|The: a before a consonant, az before a vowel. A/an: always egy. Hungarian often drops the indefinite article, e.g. with professions.|a ház, az autó, egy alma; Mérnök vagyok.
g3|Plural: -k|Add -k with a linking vowel by harmony: -ok/-ak (back), -ek (front), -ök (ö ő ü ű). After a vowel just -k; final a/e lengthen to á/é.|ház → házak; kert → kertek; macska → macskák; iskola → iskolák
g3|Singular after numbers|After a number, sok, néhány or hány?, the noun stays singular.|két öcsém; három macska; sok macska; Hány macskád van?
g3|Adjectives and the plural|An adjective before a noun never takes -k. After “to be” with a plural subject it takes -k/-ak/-ek.|piros autók; Az autók pirosak. / Azok a házak szépek.
g3|Direct object: -t|Add -t, with a linking vowel after most consonants (-ot/-at/-et/-öt). After a vowel or l, ly, j, n, ny, r, s, sz, z, zs just -t.|kávé → kávét; könyv → könyvet; ház → házat; pénz → pénzt; Szeretem Budapestet.
g3|Indirect object and “X has Y”: -nak/-nek|-nak/-nek means to/for someone. It also marks the owner in “X has Y” (the owned noun takes a possessive ending).|Kinek segítesz? A kolléganőmnek. / A gyereknek van játéka.
g3|With / by: -val/-vel|After a vowel: -val/-vel. After a consonant the v becomes that consonant, doubling it.|autóval; busszal; kanállal; Tamarával; Pammel; a férjemmel
g3|Possessive endings: vowel-ending nouns|my/your/his-her/our/your (pl.)/their: -m, -d, -ja/-je, -nk, -tok/-tek/-tök, -juk/-jük. The vowel is lengthened (a → á).|kutya → kutyám, kutyád, kutyája, kutyánk, kutyátok, kutyájuk
g3|Possessive endings: consonant-ending nouns|Back: -om, -od, -a/-ja, -unk, -otok, -uk/-juk. Front: -em, -ed, -e/-je, -ünk, -etek, -ük/-jük.|család → családom, családod, családja…; kert → kertem, kerted, kertje, kertünk, kertetek, kertjük
g3|My (plural things): -aim / -eim|Several possessed things: -ai-/-ei- before the person ending. Back/mixed words use -ai-, front words -ei-.|házaim, házaid; testvéreim, testvérei, testvéreink; macskáim
g3|Possessor comes first|The owner goes before the owned noun and the owned noun takes the ending. Having something: van + noun with possessive ending; not having: nincs.|a férjem neve; a fiú kutyája; Van autóm. / Nincs lakásom.
g3|Word-building suffixes|-s makes adjectives (hír → híres); -i makes origin adjectives (Amerika → amerikai); -ó/-ő makes jobs, tools, places (fest → festő); -ás/-és turns verbs into nouns (kérdez → kérdés); -ság/-ség makes abstract nouns (barát → barátság); -zik makes verbs (dolog → dolgozik).|testvér = test + vér; nagymama = nagy + mama; nyomtat → nyomtató
g4|Where? Inside: -ban/-ben|Countries, cities, buildings and 3D objects. Exceptions: Magyarország and many Hungarian towns use -on/-en/-ön.|Kanadában; Hamiltonban; iskolában; étteremben
g4|Where? On / at: -on/-en/-ön|Open spaces, surfaces, events, some institutions, Hungary and most Hungarian towns.|Budapesten; Magyarországon; koncerten; az asztalon; munkahelyen
g4|Where to / where / where from: three-way systems|Inside: -ba/-be → -ban/-ben → -ból/-ből. On/event: -ra/-re → -on/-en/-ön → -ról/-ről. Persons/next to: -hoz/-hez/-höz → -nál/-nél → -tól/-től. Final a/e lengthen.|iskolába/-ban/-ból; koncertre/-en/-ről; orvoshoz/-nál/-tól
g4|Place words after the noun|Hungarian uses postpositions placed after the noun: mögött (behind), előtt (in front of), alatt (under), fölött (above), mellett (next to), között (between).|apa mögött; anya mellett; az asztal alatt
g4|When? Days, clock, months, seasons|Days: -n/-on/-en/-ön; clock: -kor; months: -ban/-ben; seasons: tavasszal, nyáron, ősszel, télen; day parts take no ending.|hétfőn; nyolc órakor; fél nyolckor; júliusban; reggel, este
g4|Before, after, since, until|előtt = before; után = after; óta = since; -tól/-től … -ig = from … until.|ebéd előtt; ebéd után; 2004 óta; hétfőtől péntekig; 8 órától 16 óráig
g4|Dates: -a/-e vs -án/-én|Use ordinals. “Which date is it?” ends -a/-e; “on which date?” ends -án/-én. First is elseje/elsején.|Október negyedike van. / 1988. augusztus 27-én (huszonhetedikén) születtem.
g4|Telling the time|Hungarian counts toward the next hour: negyed három = 2:15, fél három = 2:30, háromnegyed három = 2:45. Ask: Hány óra van? / Mennyi az idő?|negyed három; fél három; háromnegyed három
g4|How often?|Use -szor/-szer/-ször for times; naponta, hetente, havonta, évente for daily, weekly, monthly, yearly. Mindig, gyakran, néha, soha for always, often, sometimes, never.|Négyszer főzök egy héten. / Havonta egyszer van takarítónőm.
g5|Numbers 1 to 10, 100, 1000|egy, kettő (két before a noun), három, négy, öt, hat, hét, nyolc, kilenc, tíz; száz, ezer, tízezer, millió.|két öcs, but Kettő van. / harmincnyolc éves
g5|Ordinals|első, második, harmadik, negyedik, ötödik, hatodik, hetedik, nyolcadik, kilencedik, tizedik. Add -dik to most numbers.|az ötödik gyerek; a harmadik emelet
g5|Question words|Ki? who; Mi? what; Kit? Mit? who/what (object); Kivel? with whom; Kinek? to/for whom; Milyen? what kind; Melyik? which; Hol? Hova? Honnan? where, where to, where from; Mikor? when; Miért? why; Hány? how many; Mennyi? how much.|Ki ez a férfi? / Milyen nyelven beszél? / Hol él?
g5|Hány? vs Mennyi?|Hány asks about countable things and is followed by a singular noun. Mennyi asks about amounts you can't count.|Hány testvére van? / Mennyi vizet iszol?
g5|Yes/no questions|No special word is needed: keep the sentence and raise your voice at the end. Answer Igen, … or Nem, …|Kati magyar? Igen, Kati magyar. / Van testvére?
g5|Formal vs informal “you”|Te (informal) uses 2nd person verbs; Ön (formal) uses 3rd person verbs and Önök the 3rd plural. Hogy vagy? is informal, Hogy van? is formal.|Mi a neved? / Mi a neve? Hol élsz? / Hol él?
g5|Dropping the pronoun|The verb ending shows the person, so én, te, mi, ti are usually dropped unless you want emphasis.|Magyarul tanulok. / Én tanulok japánul, nem Éva.
g5|Word order: focus before the verb|The most important word goes right before the verb; the verb itself can be stressed. Negative nem goes directly before the verb or focus.|Holnap telefonálok (nem ma). / Nem járok színházba.
g5|Modal verbs and prefixes in word order|A modal verb is usually followed by the infinitive. A verb prefix usually goes after the verb in a neutral sentence.|Szeretnék enni. / Megyek aludni. / 8 órakor kelek fel.
g5|Linking sentences|és = and; de = but; vagy = or; mert = because; hogy = that; hanem = but rather. aki = who, ami = which/what, ahol = where, amikor = when.|Nem újságíró vagyok, hanem tanár. / Van egy barátom, aki kék inget visel.
g5|Pronouns|én, te, ő/Ön, mi, ti, ők/Önök. This/that: ez/az; these/those: ezek/azok.|Ez egy magyar kokárda. / Ezek az autók pirosak.`;
const CN={F:"Family",P:"People & jobs",A:"Describing",T:"Time & weather",H:"Home & things",E:"Food & drink",V:"Verbs",W:"Places",G:"Words, endings, verb forms",S:"Sentences",1:"Questions: About you",2:"Questions: Work & daily life",3:"Questions: Free time & Hungary",C:"Countries & nationalities",D:"Dates, numbers & time",K:"Clothes & colors",I:"Interview & citizenship",g1:"Grammar: Sounds & harmony",g2:"Grammar: Verbs",g3:"Grammar: Nouns & endings",g4:"Grammar: Place & time",g5:"Grammar: Questions & sentences"};
const sz=t=>t.length>70?"s2":t.length>28?"s1":"";
const D=RAW.split("\n").map(l=>{const[c,h,e,a]=l.split("|");return{c:CN[c],h,e,a}});
const isG=x=>x.c.startsWith("Grammar");
const cats=["All",...new Set(D.filter(x=>!isG(x)).map(x=>x.c))];
const gcats=["All",...new Set(D.filter(isG).map(x=>x.c))];
const S={cat:"All",dir:"hu",mode:"cards",hide:false,i:0,flip:false,deck:[],q:null};
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("hu-known-lessons")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("hu-known-lessons",JSON.stringify([...known]))}catch(e){}};
const shuf=a=>a.sort(()=>Math.random()-.5);
const front=x=>isG(x)||S.dir=="hu"?x.h:x.e, back=x=>isG(x)||S.dir=="hu"?x.e:x.h;
const inCat=y=>S.cat=="All"||y.c==S.cat;
const pool=()=>D.filter(x=>(S.mode=="grammar")==isG(x)&&inCat(x)&&!(S.hide&&known.has(x.h)));
function build(sh){S.deck=pool();if(sh)shuf(S.deck);S.i=0;S.flip=false}
function startQuiz(){
  const p=shuf(pool()).slice(0,10);
  S.q=p.length?{items:p.map(x=>{const o=shuf(D.filter(y=>y!==x&&y.c==x.c)).slice(0,3);o.push(x);return{x,o:shuf(o)}}),n:0,s:0,p:null}:null;
}
function cardsV(){
  const d=S.deck;
  if(!d.length)return `<p class="empty">No cards to show. Pick another category or switch back to showing all cards.</p>`;
  const x=d[S.i],t=D.filter(y=>inCat(y)&&(S.mode=="grammar")==isG(y)),k=t.filter(y=>known.has(y.h)).length;
  return `<p class="meta">Card ${S.i+1} of ${d.length}. You've learned ${k} of ${t.length} in this set.</p>
  <div id="card" class="card ${S.flip?"flip":""}" data-a="flip" tabindex="0" role="button" aria-label="Flip card">
    <div class="face front"><span class="w ${sz(front(x))}">${front(x)}</span></div>
    <div class="face back"><span class="w ${sz(back(x))}">${back(x)}</span>${x.a?`<div class="ans">${x.a}</div>`:""}<small>${x.c}</small></div></div>
  <div class="row"><button class="btn no" data-a="again">Still learning</button><button class="btn go" data-a="got">Got it</button></div>
  <p class="hint">Tap the card to flip it. ${S.mode=="grammar"?"":`<button class="link" data-a="say">Hear the Hungarian</button>`}</p>`;
}
function quizV(){
  const q=S.q;
  if(!q)return `<p class="empty">Nothing to quiz on here. The quiz covers vocab, sentences and questions (grammar is in the Grammar tab). Pick another category or show all cards.</p>`;
  if(q.n>=q.items.length)return `<div class="done"><p class="w">${q.s} of ${q.items.length}</p><p>${q.s==q.items.length?"A perfect round.":"Review the misses in flashcards, then go again."}</p><button class="btn go" data-a="retry" style="width:100%">New round</button></div>`;
  const it=q.items[q.n],x=it.x;
  const o=it.o.map((y,j)=>{let c="opt";if(q.p!==null){if(y===x)c+=" ok";else if(j==q.p)c+=" bad"}return `<button class="${c}" data-a="pick" data-v="${j}" ${q.p!==null?"disabled":""}>${back(y)}</button>`}).join("");
  return `<p class="meta">Question ${q.n+1} of ${q.items.length}. Score: ${q.s}.</p><div class="qs"><span class="w ${sz(front(x))}">${front(x)}</span></div><div class="o2">${o}</div>`+(q.p!==null?`<button class="btn go" data-a="next" style="width:100%">Next</button>`:"");
}
function render(){
  const tabs=[["cards","Flashcards"],["quiz","Quiz"],["grammar","Grammar"]].map(([m,l])=>`<button class="chip ${m==S.mode?"on":""}" data-a="mode" data-v="${m}">${l}</button>`).join("");
  const chips=(S.mode=="grammar"?gcats:cats).map(c=>`<button class="chip ${c==S.cat?"on":""}" data-a="cat" data-v="${c}">${c}</button>`).join("");
  const opts=`${S.mode=="grammar"?"":`<button class="link" data-a="dir">${S.dir=="hu"?"Hungarian to English":"English to Hungarian"}</button>`}<button class="link" data-a="shuf">Shuffle</button><button class="link" data-a="hide">${S.hide?"Hiding learned cards":"Showing all cards"}</button>`;
  document.getElementById("app").innerHTML=`<div class="chips">${tabs}</div><div class="chips">${chips}</div><div class="opts">${opts}</div>`+(S.mode=="quiz"?quizV():cardsV());
}
function reset(sh){if(S.mode=="quiz")startQuiz();else build(sh);render()}
function advance(gotIt){
  const x=S.deck[S.i];
  if(gotIt)known.add(x.h);else known.delete(x.h);save();
  if(gotIt&&S.hide){S.deck.splice(S.i,1);if(S.i>=S.deck.length)S.i=0}
  else S.i=(S.i+1)%S.deck.length;
  S.flip=false;render();
}
function act(b){
  const a=b.dataset.a,v=b.dataset.v;
  if(a=="cat"){S.cat=v;reset(false)}
  else if(a=="mode"){S.mode=v;S.cat="All";reset(false)}
  else if(a=="dir"){S.dir=S.dir=="hu"?"en":"hu";S.flip=false;reset(false)}
  else if(a=="shuf")reset(true);
  else if(a=="hide"){S.hide=!S.hide;reset(false)}
  else if(a=="flip"){S.flip=!S.flip;document.getElementById("card").classList.toggle("flip")}
  else if(a=="got")advance(true);
  else if(a=="again")advance(false);
  else if(a=="say"){try{const u=new SpeechSynthesisUtterance(S.deck[S.i].h);u.lang="hu-HU";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
  else if(a=="pick"){const q=S.q;q.p=+v;if(q.items[q.n].o[q.p]===q.items[q.n].x)q.s++;render()}
  else if(a=="next"){S.q.n++;S.q.p=null;render()}
  else if(a=="retry"){startQuiz();render()}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b)});
document.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.id=="card"){e.preventDefault();act(e.target)}});
build(false);render();
</script></body></html>
